name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check chrome_extension/background.js
          node --check chrome_extension/popup.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest -v test_extension

      - name: Build extension package
        run: python tools/build_package.py

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: cookie-hub-extension
          path: dist/
          if-no-files-found: error
